<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Putting Tempo</title>
<style>
:root { --gold-text: #f0cd62; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: repeating-linear-gradient(90deg, #3f7d3a 0 28px, #468741 28px 56px);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  padding: 24px 16px;
}
main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }

/* Glossy pills: top half lit, hard edge at the middle, like 2000s broadcast chrome. */
.t { display: flex; align-items: center; border-radius: 999px; font-size: 13px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.5); }
.c { justify-content: center; }
.k { background: linear-gradient(#4f4f4f 0%, #242424 49%, #000 50%, #1a1a1a 100%); color: #fff;
  border: 1px solid #d4a62a; text-shadow: 0 1px 1px #000;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 4px rgba(0,0,0,.5); }
.g { background: linear-gradient(#fbe9a0 0%, #e0b53a 49%, #a57a12 50%, #cf9f22 100%); color: #2b1d02;
  border: 1px solid #6b4a08; text-shadow: 0 1px 0 rgba(255,255,255,.45); }
.s { background: linear-gradient(#fafafa 0%, #d6d6d6 49%, #8f8f8f 50%, #c4c4c4 100%); color: #1a1a1a;
  border: 1px solid #555; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.r { background: linear-gradient(#ff7a6e 0%, #d8301f 49%, #8f1209 50%, #c4241a 100%); color: #fff;
  border: 1px solid #5c0b05; text-shadow: 0 1px 1px rgba(0,0,0,.6); }
.n { background: linear-gradient(#6a6a6a 0%, #474747 49%, #2a2a2a 50%, #3c3c3c 100%); color: #ccc;
  border: 1px solid #222; }
.gl { background: linear-gradient(#3a3a3a 0%, #1c1c1c 49%, #000 50%, #141414 100%);
  border: 1px solid #d4a62a; border-radius: 18px; color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 4px rgba(0,0,0,.5); }
.trk { background: #0a0a0a; border: 1px solid #444; border-radius: 999px; box-shadow: inset 0 2px 4px rgba(0,0,0,.8); }
.cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-text); }

.top { display: flex; flex-wrap: wrap; gap: 6px; }
.top .t { height: 28px; padding: 0 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #888; margin-right: 6px; }
.dot.on { background: #4cd964; box-shadow: 0 0 6px #4cd964; }
#reset { margin-left: auto; cursor: pointer; font: inherit; font-size: 11px; }
#status { height: 28px; padding: 0 14px; font-size: 12px; text-transform: none; letter-spacing: .03em; }
#verdict { height: 56px; font-size: 20px; letter-spacing: .1em; transition: filter .2s; }
#verdict.flash { animation: flash .6s; }
@keyframes flash { 0% { filter: brightness(1.6); } 100% { filter: none; } }
.ratio { display: flex; justify-content: space-between; align-items: flex-end; }
#ratio { font-size: 34px; font-weight: 500; line-height: 1.2; font-variant-numeric: tabular-nums; }
.meter { position: relative; margin-top: 18px; }
.meter .trk { height: 16px; position: relative; }
.zone { position: absolute; top: 2px; bottom: 2px; left: 40%; width: 20%; box-shadow: none; }
#marker { position: absolute; top: -4px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
  transition: left .35s cubic-bezier(.34, 1.3, .64, 1); }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; margin-top: 6px; }
#msg { font-size: 13px; color: var(--gold-text); margin-top: 8px; line-height: 1.4; min-height: 18px; }
.times { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row > div:first-child { width: 70px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.row .trk { flex: 1; padding: 2px; }
.bar { height: 26px; padding: 0 10px; min-width: 64px; transition: width .25s; font-variant-numeric: tabular-nums; }
.hist-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hist-head .t { height: 24px; padding: 0 12px; font-size: 11px; display: inline-flex; }
#avg { font-size: 12px; text-shadow: 0 1px 2px #000; }
#hist { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
#hist .t { height: 34px; font-size: 12px; letter-spacing: .02em; cursor: pointer; }
#hist .t.sel { outline: 2px solid #fff; outline-offset: 1px; }
#hist .t.n { cursor: default; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="t g c">Putting tempo</div>
    <div class="t k c" style="font-size:11px"><span id="dot" class="dot"></span><span id="conn">Connecting</span></div>
    <button id="reset" class="t k c" style="height:28px;padding:0 12px">New session</button>
  </div>

  <div id="status" class="t k">Connecting to putter sensor…</div>

  <div id="verdict" class="t c n">Awaiting putt</div>

  <div class="gl" style="padding:14px">
    <div class="ratio">
      <div><div class="cap">Stroke ratio</div><div id="ratio">–.–– : 1</div></div>
      <div style="text-align:right"><div class="cap">Target</div>
        <div style="font-size:20px;font-weight:500;line-height:1.3;color:var(--gold-text)">2 : 1</div></div>
    </div>
    <div class="meter">
      <div class="trk">
        <div class="t g zone"></div>
        <div id="marker" class="t s" style="left:50%;opacity:.25"></div>
      </div>
      <div class="scale"><span>1.5</span><span>2.0</span><span>2.5</span></div>
    </div>
    <div id="msg">Hold still at address, then putt.</div>
  </div>

  <div class="gl times">
    <div class="cap" style="display:flex;justify-content:space-between"><span>Stroke times</span><span id="total"></span></div>
    <div class="row"><div>Back</div><div class="trk"><div id="back" class="t g bar" style="width:0"></div></div></div>
    <div class="row"><div>Forward</div><div class="trk"><div id="fwd" class="t s bar" style="width:0"></div></div></div>
  </div>

  <div>
    <div class="hist-head"><div class="t k c">Last 5 putts</div><span id="avg"></span></div>
    <div id="hist"></div>
  </div>
</main>

<script>
const LOW = 1.9, HIGH = 2.1, SHOWN = 5;
let putts = [], sel = -1;
const $ = id => document.getElementById(id);
const ratio = p => p.back / p.forward;
const good = p => ratio(p) >= LOW && ratio(p) <= HIGH;

function draw() {
  const p = putts[sel];
  if (p) {
    const r = ratio(p), ok = good(p);
    $("verdict").className = "t c " + (ok ? "g" : "r");
    $("verdict").textContent = ok ? "Good tempo" : "Off tempo";
    $("ratio").textContent = r.toFixed(2) + " : 1";
    $("marker").style.left = Math.max(0, Math.min(100, (r - 1.5) * 100)) + "%";
    $("marker").style.opacity = 1;
    $("msg").textContent = ok ? "In rhythm. Back and forward stroke are balanced."
      : r > HIGH ? "Backstroke too slow compared to the forward stroke."
      : "Backstroke rushed compared to the forward stroke.";
    $("total").textContent = "Putt " + (sel + 1) + " · total " + (p.back + p.forward).toFixed(2) + " s";
    $("back").style.width = Math.min(100, p.back * 100) + "%";
    $("fwd").style.width = Math.min(100, p.forward * 100) + "%";
    $("back").textContent = p.back.toFixed(2) + " s";
    $("fwd").textContent = p.forward.toFixed(2) + " s";
  }

  const hist = $("hist");
  hist.innerHTML = "";
  const start = Math.max(0, putts.length - SHOWN);
  for (let i = start; i < start + SHOWN; i++) {
    const d = document.createElement("div");
    const q = putts[i];
    if (!q) { d.className = "t c n"; d.textContent = "–"; hist.appendChild(d); continue; }
    d.className = "t c " + (good(q) ? "g" : "r") + (i === sel ? " sel" : "");
    d.textContent = ratio(q).toFixed(2);
    d.tabIndex = 0;
    d.setAttribute("role", "button");
    d.onclick = () => { sel = i; draw(); };
    d.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { sel = i; draw(); } };
    hist.appendChild(d);
  }
  if (putts.length) {
    const rs = putts.map(ratio), mean = rs.reduce((a, b) => a + b) / rs.length;
    const inZone = putts.filter(good).length;
    $("avg").textContent = `Avg ${mean.toFixed(2)} : 1 · ${inZone}/${putts.length} on tempo`;
  } else $("avg").textContent = "";
}

$("reset").onclick = () => {
  putts = []; sel = -1;
  $("verdict").className = "t c n"; $("verdict").textContent = "Awaiting putt";
  $("ratio").textContent = "–.–– : 1"; $("marker").style.opacity = .25; $("marker").style.left = "50%";
  $("msg").textContent = "Hold still at address, then putt.";
  $("total").textContent = ""; for (const id of ["back", "fwd"]) { $(id).style.width = 0; $(id).textContent = ""; }
  draw();
};

const events = new EventSource("/events");
events.onmessage = e => {
  const ev = JSON.parse(e.data);
  if (ev.type === "status") {
    $("status").textContent = ev.text;
    $("dot").className = "dot" + (ev.connected ? " on" : "");
    $("conn").textContent = ev.connected ? "Putter sensor connected" : "Sensor offline";
  } else if (ev.type === "putt") {
    putts.push(ev); sel = putts.length - 1; draw();
    $("verdict").classList.remove("flash"); void $("verdict").offsetWidth; $("verdict").classList.add("flash");
  }
};
events.onerror = () => { $("status").textContent = "Lost connection to tempo_app.py"; $("dot").className = "dot"; };
draw();
</script>
</body>
</html>
